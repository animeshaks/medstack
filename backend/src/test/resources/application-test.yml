spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

medstack:
  jwt:
    secret: test-secret-minimum-64-chars-for-hmac-sha512-test-only-value-here-please-make-it-long-enough-for-hs512
    expiration-ms: 86400000

server:
  port: 0

logging:
  level:
    com.pharma.medstack: DEBUG

<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MedStack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
</head>
<body>

  <!-- Sidebar backdrop for mobile -->
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="logo">
      <span class="logo-icon">💊</span>
      <span class="logo-text">MedStack</span>
    </div>

    <nav class="sidebar-nav" id="sidebarNav">
      <!-- Populated by sidebar.js based on role -->
    </nav>

    <div class="sidebar-toggle">
      <button class="toggle-btn" id="sidebarToggle" title="Toggle sidebar">◀</button>
    </div>
  </aside>

  <!-- Navbar -->
  <header class="navbar" id="navbar">
    <div class="navbar-left">
      <button class="toggle-btn mobile-menu-btn" id="mobileMenuBtn" title="Menu">☰</button>
      <span class="navbar-title" id="navbarTitle">Dashboard</span>
    </div>
    <div class="navbar-right">
      <div class="navbar-user" id="navbarUser" title="My Profile &amp; Account Settings" style="cursor:pointer">
        <span class="user-badge" id="userRoleBadge"></span>
        <span class="user-name" id="userNameDisplay"></span>
        <span style="font-size:0.75rem;opacity:0.6;margin-left:2px">⚙️</span>
      </div>
      <button class="toggle-btn" id="themeToggle" title="Toggle theme">☀️</button>
      <button class="btn btn-secondary btn-sm" id="logoutBtn">Logout</button>
    </div>
  </header>

  <!-- Main content -->
  <main class="main-content" id="mainContent">
    <div class="loading-overlay" id="pageLoader">
      <div>
        <div class="spinner" style="width:32px;height:32px;margin:0 auto 12px;"></div>
        <div style="font-size:0.8rem;color:var(--text-muted);">Loading...</div>
      </div>
    </div>
  </main>

  <!-- Toast container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Modal container -->
  <div id="modalContainer"></div>

  <!-- Chart.js for reports & analytics charts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MedStack — Login</title>
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-primary);
      font-family: var(--font-mono);
      position: relative;
      overflow: hidden;
    }

    /* Animated grid background in dark mode */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.4;
      pointer-events: none;
    }

    [data-theme="light"] body::before {
      background-image:
        linear-gradient(#e2e8f0 1px, transparent 1px),
        linear-gradient(90deg, #e2e8f0 1px, transparent 1px);
      opacity: 0.6;
    }

    .login-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 40px;
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 1;
      box-shadow: var(--shadow);
    }

    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-logo {
      font-size: 2.2rem;
      color: var(--accent);
      margin-bottom: 8px;
      display: block;
    }

    .login-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .login-subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 6px;
      letter-spacing: 0.02em;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    [data-theme="dark"] .form-label::before { content: '$ '; color: var(--accent); }

    .form-control {
      width: 100%;
      padding: 10px 14px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 0.9rem;
      transition: border-color var(--transition), box-shadow var(--transition);
      box-sizing: border-box;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: var(--accent-glow);
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: var(--radius);
      font-family: var(--font-mono);
      font-size: 0.9rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: all var(--transition);
      margin-top: 8px;
    }

    .btn-login:hover:not(:disabled) {
      opacity: 0.85;
      box-shadow: var(--accent-glow);
    }

    .btn-login:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    [data-theme="dark"] .btn-login:hover:not(:disabled) {
      box-shadow: 0 0 20px rgba(0,255,65,0.5), 0 0 40px rgba(0,255,65,0.2);
    }

    .error-msg {
      background: rgba(255,68,68,0.1);
      border: 1px solid var(--danger);
      border-radius: var(--radius);
      color: var(--danger);
      padding: 10px 14px;
      font-size: 0.8rem;
      margin-bottom: 16px;
      display: none;
    }

    .error-msg.visible { display: block; }

    .theme-toggle {
      position: absolute;
      top: 16px;
      right: 16px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 6px 10px;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 0.9rem;
      transition: all var(--transition);
    }

    .theme-toggle:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.7rem;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }

    .spinner-inline {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(0,0,0,0.3);
      border-top-color: #000;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    [data-theme="light"] .form-control {
      background: #f8fafc;
      border-color: #e2e8f0;
    }
  </style>
</head>
<body>

  <button class="theme-toggle" id="themeToggle" title="Toggle theme">☀️</button>

  <div class="login-card">
    <div class="login-header">
      <span class="login-logo">💊</span>
      <div class="login-title">MedStack</div>
      <div class="login-subtitle">Pharmacy POS &amp; Management</div>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input
          class="form-control"
          type="text"
          id="username"
          name="username"
          placeholder="admin / owner / staff"
          autocomplete="username"
          required
        />
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input
          class="form-control"
          type="password"
          id="password"
          name="password"
          placeholder="••••••••"
          autocomplete="current-password"
          required
        />
      </div>
      <button class="btn-login" type="submit" id="loginBtn">
        Login
      </button>
    </form>

    <div style="margin-top:16px;padding:12px;background:var(--bg-tertiary);border-radius:var(--radius);border:1px dashed var(--border);font-size:0.75rem">
      <div style="color:var(--text-muted);margin-bottom:6px;font-weight:600">Quick Demo Credentials:</div>
      <div style="display:flex;gap:6px">
        <button type="button" class="btn btn-sm btn-secondary" onclick="document.getElementById('username').value='admin';document.getElementById('password').value='Admin@123'" style="padding:4px 8px;font-size:0.75rem;cursor:pointer">Admin</button>
        <button type="button" class="btn btn-sm btn-secondary" onclick="document.getElementById('username').value='owner';document.getElementById('password').value='Owner@123'" style="padding:4px 8px;font-size:0.75rem;cursor:pointer">Owner</button>
        <button type="button" class="btn btn-sm btn-secondary" onclick="document.getElementById('username').value='staff';document.getElementById('password').value='Staff@123'" style="padding:4px 8px;font-size:0.75rem;cursor:pointer">Staff</button>
      </div>
    </div>

    <div class="login-footer">MedStack v1.0 &mdash; Secure Pharmacy Management</div>
  </div>

  <script type="module">
    import { login, isAuthenticated } from '/js/auth.js';

    // Redirect if already logged in
    if (isAuthenticated()) window.location.href = '/';

    // Theme
    const savedTheme = localStorage.getItem('ms_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    const themeToggle = document.getElementById('themeToggle');
    themeToggle.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

    themeToggle.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('ms_theme', next);
      themeToggle.textContent = next === 'dark' ? '☀️' : '🌙';
    });

    // Login form
    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const loginBtn = document.getElementById('loginBtn');

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.add('visible');
    }

    function hideError() {
      errorMsg.classList.remove('visible');
    }

    function setLoading(loading) {
      loginBtn.disabled = loading;
      loginBtn.innerHTML = loading
        ? '<span class="spinner-inline"></span> Authenticating...'
        : 'Login';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        showError('Username and password are required.');
        return;
      }

      setLoading(true);
      try {
        const result = await login(username, password);
        if (result.success) {
          window.location.href = '/';
        } else {
          showError(result.message || 'Invalid credentials. Please try again.');
        }
      } catch (err) {
        showError('Connection error. Is the backend running?');
      } finally {
        setLoading(false);
      }
    });

    // Enter key on password
    document.getElementById('password').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') form.dispatchEvent(new Event('submit'));
    });
  </script>
</body>
</html>
